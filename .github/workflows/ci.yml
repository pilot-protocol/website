name: ci

on:
  # Deploys run only from here: Actions > ci > Run workflow.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # next typegen writes next-env.d.ts and the route types that tsc reads.
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The production build (the sky variant), as deploy:app makes it. Payload-backed pages render per
      # request, so the build only needs the local D1 that Wrangler's platform proxy creates.
      - name: Build the Worker
        env:
          NEXT_PUBLIC_SITE_VARIANT: sky
          NEXT_PUBLIC_SERVER_URL: https://pilotprotocol.network
        run: npx opennextjs-cloudflare build

      # npm run deploy: the migrations on the production D1, then the sky build to the
      # pilot-protocol-website Worker at pilotprotocol.network. See "Deploy to Cloudflare" in README.md
      # for the one-time setup (D1 database id, PAYLOAD_SECRET, the domain) this needs first.
      - name: Deploy to Cloudflare
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
