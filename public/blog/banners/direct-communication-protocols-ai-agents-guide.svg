<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Node circles representing agents -->
  <circle cx="200" cy="315" r="28" fill="none" stroke="#3b82f6" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <circle cx="200" cy="315" r="10" fill="#3b82f6" opacity="0.8"/>
  <text x="200" y="360" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="13">MCP</text>

  <circle cx="400" cy="200" r="28" fill="none" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <circle cx="400" cy="200" r="10" fill="#06b6d4" opacity="0.8"/>
  <text x="400" y="245" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="13">A2A</text>

  <circle cx="600" cy="315" r="36" fill="none" stroke="#6366f1" stroke-width="3" filter="url(#glow)"/>
  <circle cx="600" cy="315" r="14" fill="#6366f1" opacity="0.9"/>
  <text x="600" y="370" text-anchor="middle" fill="#a5b4fc" font-family="monospace" font-size="14" font-weight="bold">Pilot</text>

  <circle cx="800" cy="200" r="28" fill="none" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <circle cx="800" cy="200" r="10" fill="#8b5cf6" opacity="0.8"/>
  <text x="800" y="245" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="13">ACP</text>

  <circle cx="1000" cy="315" r="28" fill="none" stroke="#ec4899" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <circle cx="1000" cy="315" r="10" fill="#ec4899" opacity="0.8"/>
  <text x="1000" y="360" text-anchor="middle" fill="#f9a8d4" font-family="monospace" font-size="13">ANP</text>

  <!-- Connection lines -->
  <line x1="228" y1="315" x2="372" y2="220" stroke="url(#accent)" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,4"/>
  <line x1="428" y1="215" x2="566" y2="300" stroke="url(#accent)" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,4"/>
  <line x1="634" y1="300" x2="772" y2="215" stroke="url(#accent)" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,4"/>
  <line x1="828" y1="215" x2="972" y2="300" stroke="url(#accent)" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,4"/>
  <line x1="228" y1="330" x2="566" y2="325" stroke="#3b82f6" stroke-width="1" opacity="0.3" stroke-dasharray="4,6"/>
  <line x1="634" y1="325" x2="972" y2="325" stroke="#3b82f6" stroke-width="1" opacity="0.3" stroke-dasharray="4,6"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Title -->
  <text x="600" y="480" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">AI Agent Communication Protocols</text>

  <!-- Subtitle -->
  <text x="600" y="530" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22">Pilot · MCP · A2A · ACP · ANP — compared</text>

  <!-- Pilot Protocol label -->
  <text x="600" y="590" text-anchor="middle" fill="#475569" font-family="monospace" font-size="16">pilotprotocol.network</text>
</svg>
